name: Build and test wheels 🐍

on:
  push:
    # feature branches get their CI from the pull_request trigger; running the
    # push event there too just produced a cancelled twin whose never-started
    # jobs render as 0s "failures" with raw matrix-template names in the PR
    # checks list.  for a branch without an open PR, use the workflow_dispatch
    # trigger defined below.
    branches:
      - develop
      - main
    paths-ignore:
      - 'python/docs/**'
      - 'doc_resources/**'
      - 'Doxyfile'
      - '**/*.md'
      - '**/*.html'
      - '.github/workflows/build_docs.yml'
  pull_request:
    paths-ignore:
      - 'python/docs/**'
      - 'doc_resources/**'
      - 'Doxyfile'
      - '**/*.md'
      - '**/*.html'
      - '.github/workflows/build_docs.yml'
  workflow_call:
    inputs:
      minimal:
        description: 'Build only the ubuntu-latest / python-3.11 wheel; skip C++ tests, Windows, macOS, and wheel tests.'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Branch, tag, or SHA to check out before building (defaults to the calling workflow''s ref).'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run full OS and Python matrix'
        required: false
        type: boolean
        default: false
      minimal:
        description: 'Build only the ubuntu-latest / python-3.11 wheel; skip C++ tests, Windows, macOS, and wheel tests.'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Single source of truth for the eigenpy version built from source for the
# Linux/macOS wheels.  Pin exact for reproducible builds; bump deliberately
# (eigenpy >= 3.13 requires Python >= 3.10, so the wheel matrix drops 3.9).
env:
  EIGENPY_VERSION: "3.13.0"

jobs:
  set_matrix:
    name: Set OS matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
      python_versions: ${{ steps.matrix.outputs.python_versions }}
    steps:
      - name: Set OS matrix
        id: matrix
        run: |
          # macos-15-intel is intentionally omitted: an MPFR/Boost interaction
          # causes SIGABRT in pytest that we cannot reproduce locally (no Intel
          # Mac available to the maintainer). Intel macOS support is paused
          # pending a reproducer or an upstream fix. Re-add "macos-15-intel"
          # below when ready to revisit.
          if [[ "${{ inputs.minimal }}" == "true" ]]; then
            echo 'os=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo 'python_versions=["3.11"]' >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/develop" || "${{ github.ref }}" == refs/tags/* || "${{ inputs.full_matrix }}" == "true" || "${{ github.event.pull_request.base.ref }}" == "develop" || "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            echo 'os=["ubuntu-latest","macos-14"]' >> $GITHUB_OUTPUT
            echo 'python_versions=["3.10","3.11","3.12","3.13","3.14"]' >> $GITHUB_OUTPUT
          else
            echo 'os=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo 'python_versions=["3.11"]' >> $GITHUB_OUTPUT
          fi

  test_cpp_unix:
    name: C++ tests on ${{ matrix.os }}
    if: ${{ inputs.minimal != true }}
    needs: [set_matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.set_matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget libgmp-dev libmpfr-dev libmpc-dev libeigen3-dev libtool openmpi-bin libopenmpi-dev ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr libmpc eigen@3 open-mpi ccache

      # compiler cache: makes recompiles of unchanged C++ near-free.  the key is
      # deliberately loose (always save fresh, restore newest) -- ccache does its
      # own invalidation; do not key on file hashes.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-cpp-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-cpp-${{ matrix.os }}-

      - name: Build Boost base (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp
          curl -fsSL -o boost_1_90_0.tar.bz2 https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2
          tar xjf boost_1_90_0.tar.bz2
          cd boost_1_90_0
          ./bootstrap.sh --prefix=/tmp/boost-base \
            --with-libraries=serialization,filesystem,graph,chrono,regex,timer,log,thread,test
          ./b2 install -j$(nproc)

      - name: Build Boost base (macOS)
        if: runner.os == 'macOS'
        run: |
          cd /tmp
          curl -fsSL -o boost_1_90_0.tar.bz2 https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2
          tar xjf boost_1_90_0.tar.bz2
          cd boost_1_90_0
          ./bootstrap.sh --prefix=/tmp/boost-base \
            --with-libraries=serialization,filesystem,graph,chrono,regex,timer,log,thread,test
          ./b2 install -j2 hardcode-dll-paths=true dll-path=/tmp/boost-base/lib

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH=/tmp/boost-base \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DENABLE_UNIT_TESTING=ON \
            -DINSTALL_DOCUMENTATION=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 400M
        run: cmake --build build --parallel 2

      - name: ccache stats
        if: always()
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache -s || true

      - name: Test
        working-directory: build
        env:
          LD_LIBRARY_PATH: /tmp/boost-base/lib:/tmp/boost-base/lib64
          DYLD_LIBRARY_PATH: /tmp/boost-base/lib
        run: ctest --output-on-failure --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

  test_cpp_windows:
    name: C++ tests on Windows
    if: ${{ inputs.minimal != true }}
    runs-on: windows-latest
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}\conda_pkgs
    steps:
      - uses: actions/checkout@v5

      - name: Cache conda packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\conda_pkgs
          key: windows-conda-cpp-${{ hashFiles('environment-win.yml', '.github/workflows/build_and_test.yml') }}
          restore-keys: |
            windows-conda-cpp-
            windows-conda-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: b2-windows
          environment-file: environment-win.yml
          auto-activate-base: false
          channel-priority: strict

      - name: Configure and build C++ tests
        shell: pwsh
        run: |
          $env:CC = 'clang-cl'
          $env:CXX = 'clang-cl'
          $env:CMAKE_GENERATOR = 'Ninja'
          $env:CMAKE_GENERATOR_PLATFORM = ''
          $env:CMAKE_GENERATOR_TOOLSET = ''
          $env:CMAKE_PREFIX_PATH = "$env:CONDA_PREFIX\Library"

          $boostHeader = "$env:CONDA_PREFIX\Library\include\boost\archive\archive_exception.hpp"
          (Get-Content $boostHeader).Replace('public virtual std::exception', 'public std::exception') | Set-Content $boostHeader

          cmake -B build `
            -DCMAKE_PREFIX_PATH="$env:CONDA_PREFIX\Library" `
            -DBUILD_PYTHON_BINDINGS=OFF `
            -DENABLE_UNIT_TESTING=ON `
            -DUSE_CCACHE=OFF `
            -DINSTALL_DOCUMENTATION=OFF `
            -DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=ON `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Test
        shell: pwsh
        working-directory: build
        run: ctest --output-on-failure --parallel

  build_macos_ubuntu_wheels:
    name: ${{ matrix.os }} Python-${{ matrix.python-version }} wheels
    needs: [set_matrix, test_cpp_unix]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.set_matrix.outputs.os) }}
        python-version: ${{ fromJson(needs.set_matrix.outputs.python_versions) }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Cache cibuildwheel + pip + Homebrew
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
            ~/Library/Caches/Homebrew
            /tmp/boost_1_90_0.tar.bz2
            /tmp/eigen-3.4.0.tar.gz
            /tmp/eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz
          key: ${{ runner.os }}-cibw-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'python/pyproject.toml', 'CMakeLists.txt', 'core/CMakeLists.txt', '.github/workflows/build_and_test.yml', 'python_bindings/include/tracker_export.hpp', 'python_bindings/include/endgame_export.hpp') }}
          restore-keys: |
            ${{ runner.os }}-cibw-${{ matrix.python-version }}-
            ${{ runner.os }}-cibw-
      # compiler cache for the bertini2 compile itself (deps are built by their
      # own build systems and are out of ccache's cmake-launcher reach).  the key
      # is deliberately loose -- always save fresh, restore newest; ccache does
      # its own invalidation.  on Linux the cache lives in the repo dir because
      # that is what cibuildwheel mounts into the container (as /project).
      - name: Cache ccache (bertini2 compile)
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-wheels-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            ccache-wheels-${{ runner.os }}-${{ matrix.python-version }}-
            ccache-wheels-${{ runner.os }}-
      - name: Set CIBW_BUILD for this Python version
        shell: bash
        run: |
          PY="${{ matrix.python-version }}"
          PY_TAG="cp${PY//./}"
          echo "CIBW_BUILD=${PY_TAG}-manylinux* ${PY_TAG}-macosx*" >> $GITHUB_ENV
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SW_VERS=$(sw_vers -productVersion | cut -d. -f1)
          echo "MACOSX_DEPLOYMENT_TARGET=${SW_VERS}.0" >> $GITHUB_ENV
      - uses: pypa/cibuildwheel@v3.4.1
        env:
          # Build cp310 through cp314 for both Linux (manylinux) and macOS (cp39 was
          # dropped when eigenpy moved to >= 3.13, whose floor is Python 3.10).
          # Boost.Python and eigenpy are rebuilt per target Python in BEFORE_BUILD
          # so each wheel bundles a matching libboost_python3X.
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          # Install system deps + download (but DO NOT build) Boost & eigenpy sources
          # once per container. Boost.Python is ABI-locked to a single CPython version,
          # so it must be rebuilt per target Python in BEFORE_BUILD — building it here
          # against the manylinux system python3 produces a single libboost_python3X that
          # all wheels would then bundle, breaking import on the other CPython versions.
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y wget gmp-devel mpfr-devel libmpc-devel libtool &&
            { yum install -y ccache || { yum install -y epel-release && yum install -y ccache; }; } &&
            ccache --version &&
            cd /tmp &&
            { [ -f eigen-3.4.0.tar.gz ] || wget -q https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz ; } &&
            rm -rf eigen-3.4.0 && tar xzf eigen-3.4.0.tar.gz &&
            cmake -S eigen-3.4.0 -B eigen-3.4.0/bld -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release &&
            cmake --install eigen-3.4.0/bld &&
            { [ -f eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz ] || wget -q https://github.com/stack-of-tasks/eigenpy/releases/download/v${{ env.EIGENPY_VERSION }}/eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz ; }
          # On macOS, Homebrew's boost-python3 / eigenpy bottles track the current
          # Homebrew default Python (now 3.14), so a cp313 wheel that bundles them
          # imports a libboost_python314.dylib into a 3.13 interpreter and segfaults.
          # Install only the Python-version-independent libs from brew here; download
          # Boost & eigenpy sources to /tmp for the per-Python build in BEFORE_BUILD.
          CIBW_BEFORE_ALL_MACOS: >
            brew install gmp mpfr libmpc eigen@3 ccache &&
            cd /tmp &&
            { [ -f eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz ] || curl -fsSL -o eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz https://github.com/stack-of-tasks/eigenpy/releases/download/v${{ env.EIGENPY_VERSION }}/eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz ; }

          # Build Boost and eigenpy fresh against the active per-Python interpreter
          # so each wheel bundles a matching libboost_python3X.
          CIBW_BEFORE_BUILD_LINUX: >
            pip install scikit-build-core numpy scipy &&
            rm -rf /tmp/deps-py && mkdir -p /tmp/deps-py &&
            PY_VER=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')") &&
            PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))") &&
            PY_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR') or '')") &&
            cd /tmp &&
            { [ -f boost_1_90_0.tar.bz2 ] || wget -q https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2 ; } &&
            rm -rf boost_1_90_0 && tar xjf boost_1_90_0.tar.bz2 &&
            cd boost_1_90_0 &&
            ./bootstrap.sh --with-python=$(which python) --prefix=/tmp/deps-py &&
            printf 'using python : %s : %s : %s : %s ;\n' "$PY_VER" "$(which python)" "$PY_INC" "$PY_LIB" > user-config.jam &&
            ./b2 install -j$(nproc) --user-config=user-config.jam python=$PY_VER --without-mpi &&
            cd /tmp &&
            rm -rf eigenpy-${{ env.EIGENPY_VERSION }} && tar zxf eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz &&
            cd eigenpy-${{ env.EIGENPY_VERSION }} && mkdir -p bld && cd bld &&
            cmake .. -DCMAKE_PREFIX_PATH=/tmp/deps-py -DCMAKE_INSTALL_PREFIX=/tmp/deps-py -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DPython3_EXECUTABLE=$(which python) -DPython3_NumPy_INCLUDE_DIR=$(python -c "import numpy; print(numpy.get_include())") -DBUILD_TESTING=OFF -DCMAKE_INSTALL_DO_STRIP=ON &&
            make -j2 install &&
            find /tmp/deps-py -name '*.so*' -type f | while read f; do
              err=$(strip --strip-unneeded "$f" 2>&1) || echo "strip failed on $f: $err"
            done

          # On macOS, build all Boost components (including Boost.Python) into /tmp/deps-py
          # so delocate sees only one set of dylibs. boost-base is used only for C++ tests.
          CIBW_BEFORE_BUILD_MACOS: >
            pip install scikit-build-core numpy scipy &&
            rm -rf /tmp/deps-py && mkdir -p /tmp/deps-py &&
            PY_VER=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')") &&
            PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))") &&
            PY_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR') or '')") &&
            cd /tmp &&
            { [ -f boost_1_90_0.tar.bz2 ] || curl -fsSL -o boost_1_90_0.tar.bz2 https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2 ; } &&
            rm -rf boost_1_90_0 && tar xjf boost_1_90_0.tar.bz2 &&
            cd boost_1_90_0 &&
            ./bootstrap.sh --with-python=$(which python) --prefix=/tmp/deps-py &&
            printf 'using python : %s : %s : %s : %s ;\n' "$PY_VER" "$(which python)" "$PY_INC" "$PY_LIB" > user-config.jam &&
            ./b2 install -j$(sysctl -n hw.ncpu) --user-config=user-config.jam python=$PY_VER hardcode-dll-paths=true dll-path=/tmp/deps-py/lib &&
            cd /tmp &&
            rm -rf eigenpy-${{ env.EIGENPY_VERSION }} && tar zxf eigenpy-${{ env.EIGENPY_VERSION }}.tar.gz &&
            cd eigenpy-${{ env.EIGENPY_VERSION }} && mkdir -p bld && cd bld &&
            cmake .. -DCMAKE_PREFIX_PATH="/tmp/deps-py;/opt/homebrew" -DCMAKE_INSTALL_PREFIX=/tmp/deps-py -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$(which python) -DPython3_NumPy_INCLUDE_DIR=$(python -c "import numpy; print(numpy.get_include())") -DBUILD_TESTING=OFF &&
            make -j2 install
          CIBW_BEFORE_BUILD: "pip install scikit-build-core numpy"
          CIBW_ENVIRONMENT_LINUX: "LD_LIBRARY_PATH=/tmp/deps-py/lib:/tmp/deps-py/lib64:$LD_LIBRARY_PATH CMAKE_PREFIX_PATH=/tmp/deps-py CXXFLAGS=-w CMAKE_BUILD_PARALLEL_LEVEL=2 CCACHE_DIR=/project/.ccache CCACHE_MAXSIZE=400M CMAKE_ARGS='-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET CMAKE_PREFIX_PATH=/tmp/deps-py:/opt/homebrew DYLD_FALLBACK_LIBRARY_PATH=/tmp/deps-py/lib:/opt/homebrew/lib CCACHE_DIR=$GITHUB_WORKSPACE/.ccache CCACHE_MAXSIZE=400M CMAKE_ARGS='-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'"
          # Full pytest suite, restored 2026-06-08 now that the uninitialized-numpy-slot
          # crash is fixed in the bindings (see ADR-0006).  The build image is
          # manylinux_2_34 (AlmaLinux 9, MPFR 4.1; set via CIBW_MANYLINUX_X86_64_IMAGE
          # above).  The crash was NEVER MPFR-version specific - it is the all-zero
          # mpfr/mpc "uninitialized sentinel" bug, which reproduces on any MPFR version
          # (and locally); the older blame on "MPFR 3.1.6" was a misdiagnosis.  Running
          # the full suite here is the in-container proof of the fix.  If it flakes or
          # fails, revert to the import smoke test per ADR-0003 (kept there as fallback).
          CIBW_TEST_REQUIRES_LINUX: "pytest numpy sympy"
          CIBW_TEST_COMMAND_LINUX: "cd {project} && python -m pytest python/test/ -q"

      - name: ccache size (cold run = grows from nothing; warm run = hits)
        if: always()
        shell: bash
        run: |
          du -sh .ccache 2>/dev/null || echo "no .ccache directory was produced"
          if command -v ccache >/dev/null; then CCACHE_DIR=$PWD/.ccache ccache -s || true; fi

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_windows_wheels:
    name: Windows Python-${{ matrix.python-version }} wheels
    needs: [set_matrix, test_cpp_windows]
    if: ${{ inputs.minimal != true && !failure() && !cancelled() }}
    runs-on: windows-latest
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}\conda_pkgs
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Cache conda packages + pip
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ${{ github.workspace }}\conda_pkgs
            ~\AppData\Local\pip\Cache
          key: windows-conda-${{ matrix.python-version }}-${{ hashFiles('environment-win.yml', '.github/workflows/build_and_test.yml') }}
          restore-keys: |
            windows-conda-${{ matrix.python-version }}-
            windows-conda-
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: b2-windows
          environment-file: environment-win.yml
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false
          channel-priority: strict

      - name: Build Windows
        shell: pwsh
        run: |
          conda install -y python=${{ matrix.python-version }} --update-deps
          conda info
          conda list
          $env:CC = 'clang-cl'
          $env:CXX = 'clang-cl'
          $env:CMAKE_GENERATOR = 'Ninja'
          $env:CMAKE_GENERATOR_PLATFORM = ''
          $env:CMAKE_GENERATOR_TOOLSET = ''
          $env:CMAKE_PREFIX_PATH = "$env:CONDA_PREFIX\Library"

          $boostHeader = "$env:CONDA_PREFIX\Library\include\boost\archive\archive_exception.hpp"
          (Get-Content $boostHeader).Replace('public virtual std::exception', 'public std::exception') | Set-Content $boostHeader

          cd ${{ github.workspace }}
          pip install build delvewheel
          python -m build --wheel --no-isolation

          $wheelPath = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          if (-not $wheelPath) { Write-Error "No wheel found in dist/"; exit 1 }
          delvewheel repair $wheelPath -w repaired/ --add-path "$env:CONDA_PREFIX\Library\bin"
          Remove-Item dist/*.whl
          Move-Item repaired/*.whl dist/

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: ./dist/*.whl

  test_wheels_linux_macos:
    name: Test wheels on ${{ matrix.os }} / py${{ matrix.python-version }}
    # ubuntu-latest is excluded below: Linux wheels run the full pytest suite *inside*
    # the manylinux_2_34 container via CIBW_TEST_COMMAND_LINUX (see
    # build_macos_ubuntu_wheels).  This host-runner job therefore covers macOS only;
    # Windows is covered by test_wheels_windows.
    if: ${{ inputs.minimal != true }}
    needs: [set_matrix, build_macos_ubuntu_wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.set_matrix.outputs.os) }}
        python-version: ${{ fromJson(needs.set_matrix.outputs.python_versions) }}
        exclude:
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels artifact
        uses: actions/download-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

      - name: Install wheel
        run: |
          pip install numpy
          pip install --no-index --find-links dist/ bertini2

      - name: Run Python tests
        run: |
          pip install pytest sympy
          python -m pytest python/test/ -v

  test_wheels_windows:
    name: Test wheel on windows-${{ matrix.python-version }}
    if: ${{ inputs.minimal != true }}
    needs: [build_windows_wheels]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: b2-windows
          environment-file: environment-win.yml
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false
          channel-priority: strict

      - name: Download wheels artifact
        uses: actions/download-artifact@v5
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist/

      - name: Install wheel and run tests
        shell: pwsh
        run: |
          conda info
