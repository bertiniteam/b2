name: Test on macos-15-intel (temporary, pr/212)

# Temporary fast-feedback workflow while we fix the
# `test_add_systems` SIGABRT on macos-15-intel runners.
# Builds a single wheel via cibuildwheel and runs pytest.
# No publish, no sigstore. Delete once the fix lands and
# macos-15-intel is folded into the main `os:` matrix in
# build-and-publish-to-pypi.yml.

on:
  push:
    branches:
      - tmp/mac15-precision-fix-test
  workflow_dispatch:

concurrency:
  group: test-mac15-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_mac15_intel:
    name: Build + test wheel on macos-15-intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Cache cibuildwheel + pip + Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-mac15intel-cibw-${{ hashFiles('pyproject.toml', 'python/pyproject.toml', 'CMakeLists.txt', 'core/CMakeLists.txt', '.github/workflows/test-macos-15-intel.yml') }}
          restore-keys: |
            ${{ runner.os }}-mac15intel-cibw-

      - uses: pypa/cibuildwheel@v2.23
        env:
          # Single Python target to keep this loop fast.
          CIBW_BUILD: "cp310-macosx*"
          CIBW_BEFORE_ALL_MACOS: >
            brew install gmp mpfr libmpc eigen@3 &&
            cd /tmp &&
            { [ -f boost_1_87_0.tar.bz2 ] || curl -fsSL -o boost_1_87_0.tar.bz2 https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2 ; } &&
            { [ -f eigenpy-3.11.0.tar.gz ] || curl -fsSL -o eigenpy-3.11.0.tar.gz https://github.com/stack-of-tasks/eigenpy/releases/download/v3.11.0/eigenpy-3.11.0.tar.gz ; }
          CIBW_BEFORE_BUILD_MACOS: >
            pip install scikit-build-core numpy scipy &&
            rm -rf /tmp/deps-py && mkdir -p /tmp/deps-py &&
            PY_VER=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')") &&
            PY_INC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))") &&
            PY_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR') or '')") &&
            cd /tmp &&
            rm -rf boost_1_87_0 && tar xjf boost_1_87_0.tar.bz2 &&
            cd boost_1_87_0 &&
            ./bootstrap.sh --with-python=$(which python) --prefix=/tmp/deps-py &&
            printf 'using python : %s : %s : %s : %s ;\n' "$PY_VER" "$(which python)" "$PY_INC" "$PY_LIB" > user-config.jam &&
            ./b2 install -j$(sysctl -n hw.ncpu) --user-config=user-config.jam python=$PY_VER hardcode-dll-paths=true dll-path=/tmp/deps-py/lib &&
            cd /tmp &&
            rm -rf eigenpy-3.11.0 && tar zxf eigenpy-3.11.0.tar.gz &&
            cd eigenpy-3.11.0 && mkdir -p bld && cd bld &&
            cmake .. -DCMAKE_PREFIX_PATH="/tmp/deps-py;/usr/local" -DCMAKE_INSTALL_PREFIX=/tmp/deps-py -DPython3_EXECUTABLE=$(which python) -DPython3_NumPy_INCLUDE_DIR=$(python -c "import numpy; print(numpy.get_include())") -DBUILD_TESTING=OFF &&
            make -j$(sysctl -n hw.ncpu) install
          # Intel macOS Homebrew lives under /usr/local, not /opt/homebrew.
          # Bump deployment target to 15.0: Homebrew bottles on the macos-15-intel
          # runner (gmp/mpfr/mpc) are built with min target 15.0, and delocate-wheel
          # refuses to bundle dylibs with a higher min target than the wheel itself.
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=15.0 CMAKE_PREFIX_PATH=/tmp/deps-py:/usr/local DYLD_FALLBACK_LIBRARY_PATH=/tmp/deps-py/lib:/usr/local/lib"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-mac15-intel
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install wheel
        run: |
          pip install numpy
          pip install --no-index --find-links wheelhouse/ bertini

      - name: Diagnostic - isolate crash location
        run: |
          python -c "print('step 1: importing bertini'); import bertini; print('step 2: bertini imported, default_precision =', bertini.default_precision())"
          python -c "
          import bertini, numpy as np
          from bertini import System
          from bertini.function_tree.symbol import Variable
          from bertini.function_tree.root import VariableGroup
          print('step 3: constructing system')
          x = Variable('x'); y = Variable('y')
          s1 = System(); s2 = System()
          vg = VariableGroup(); vg.append(x); vg.append(y)
          s1.add_variable_group(vg); s1.add_function(y+1); s1.add_function(x*y)
          s2.add_variable_group(vg); s2.add_function(-y-1); s2.add_function(-x*y)
          print('step 4: s1 += s2')
          s1 += s2
          print('step 5: calling eval with int array')
          v = s1.eval(np.array((2,3)))
          print('step 6: eval result =', v)
          "

      - name: Run Python tests
        run: |
          pip install pytest
          pytest python/test/ -v
