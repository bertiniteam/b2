name: Build CI deps image 🐳

# Builds the manylinux + prebuilt Boost/Boost.Python + eigenpy image consumed by the wheel matrix.
# The expensive per-CPython Boost builds run in PARALLEL (one matrix runner each, inside the
# manylinux container via docker run); a final job assembles them into the image and pushes it to
# ghcr.io/bertiniteam/b2-manylinux-deps, tagged by TOOLCHAIN KEY.  Rare: only on docker/ changes or
# dispatch.
#
# One image per ARCHITECTURE, x86_64 and aarch64, each built on a runner of that architecture
# (ubuntu-24.04-arm for aarch64) so nothing runs under emulation.  The x86_64 image keeps the
# plain toolchain-key tag; the aarch64 image's tag carries an -aarch64 suffix.
#
# OWNER: the package lands under whichever org runs this; it MUST run in bertiniteam/b2 (its token
# can only push to that org's GHCR).

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'docker/manylinux-deps/**'
      - '.github/workflows/build-ci-image.yml'
      - '.github/ci-deps-versions.env'   # a version bump here rebuilds the image

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # BOOST_VERSION / EIGEN_VERSION / EIGENPY_VERSION are single-sourced in
  # .github/ci-deps-versions.env and loaded per-job (see the "Load dep versions" steps).
  MANYLINUX_TAG: "mlx2_34"
  IMAGE: "ghcr.io/bertiniteam/b2-manylinux-deps"

jobs:
  build-deps:
    name: Boost+eigenpy ${{ matrix.arch }} ${{ matrix.pytag }}
    runs-on: ${{ matrix.runner }}
    env:
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_34_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        pytag: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      # SOURCE the file, then write the three values out by name.  Do NOT cat it into
      # $GITHUB_ENV: that file carries comments, and GitHub rejects the whole command with
      # "Invalid format '# Single source of truth ...'" / "Unable to process file command
      # 'env' successfully".  That is exactly what happened when the file was introduced, and
      # it meant no image was ever built for the tag the wheel matrix asks for, so every
      # Linux wheel job failed with "No such image" for two months.
      - name: Load dep versions
        run: |
          set -a; . .github/ci-deps-versions.env; set +a
          {
            echo "BOOST_VERSION=$BOOST_VERSION"
            echo "EIGEN_VERSION=$EIGEN_VERSION"
            echo "EIGENPY_VERSION=$EIGENPY_VERSION"
          } >> "$GITHUB_ENV"
      - name: Build Boost+eigenpy for ${{ matrix.pytag }} (manylinux)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e BOOST_VERSION -e EIGEN_VERSION -e EIGENPY_VERSION \
            "$MANYLINUX_IMAGE" \
            bash docker/manylinux-deps/build-python-deps.sh "${{ matrix.pytag }}"
      - uses: actions/upload-artifact@v5
        with:
          name: deps-${{ matrix.arch }}-${{ matrix.pytag }}
          path: deps-${{ matrix.pytag }}.tar.gz
          if-no-files-found: error

  assemble-and-push:
    name: Assemble & push ${{ matrix.arch }} image
    needs: build-deps
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            suffix: ""
          - arch: aarch64
            runner: ubuntu-24.04-arm
            suffix: "-aarch64"
    steps:
      - uses: actions/checkout@v5

      # Sourced, not cat'd -- see the note on the same step in build-deps above.
      - name: Load dep versions
        run: |
          set -a; . .github/ci-deps-versions.env; set +a
          {
            echo "BOOST_VERSION=$BOOST_VERSION"
            echo "EIGEN_VERSION=$EIGEN_VERSION"
            echo "EIGENPY_VERSION=$EIGENPY_VERSION"
          } >> "$GITHUB_ENV"

      - name: Collect prebuilt deps into the build context
        uses: actions/download-artifact@v5
        with:
          pattern: deps-${{ matrix.arch }}-*
          merge-multiple: true
          path: docker/manylinux-deps/deps

      - name: Compute toolchain tag
        id: tag
        run: |
          key="boost${BOOST_VERSION}-eigen${EIGEN_VERSION}-eigenpy${EIGENPY_VERSION}-${MANYLINUX_TAG}${{ matrix.suffix }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE:$key"
          ls -lh docker/manylinux-deps/deps

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (assembly only -- fast)
        uses: docker/build-push-action@v6
        with:
          context: docker/manylinux-deps
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.key }}
            ${{ env.IMAGE }}:latest${{ matrix.suffix }}
          build-args: |
            MANYLINUX_IMAGE=quay.io/pypa/manylinux_2_34_${{ matrix.arch }}
            BOOST_VERSION=${{ env.BOOST_VERSION }}
            EIGEN_VERSION=${{ env.EIGEN_VERSION }}
            EIGENPY_VERSION=${{ env.EIGENPY_VERSION }}
