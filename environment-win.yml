name: b2-windows
channels:
  - conda-forge
  - nodefaults
dependencies:
  - cmake
  - ccache
  - cxx-compiler
  # clang provides clang-cl, the compiler the Windows builds use.  Not `compilers`, which brought
  # clang only as a dependency of its Fortran compiler (flang) and added ~600 MB of LLVM tools
  # and flang to every Windows CI cache.
  - clang
  - ninja
  - numpy
  # numpy's and scipy's BLAS: OpenBLAS (a few MB) rather than MKL (109 MB).  b2 itself links no BLAS.
  - libblas=*=*openblas
  - gmp
  - mpfr
  - mpc
  - libboost-devel
  - eigen
  - eigenpy
  - libboost-python-devel
  - vs2022_win-64
  - scipy
  - python
  - wheel
  - python-build
  - scikit-build-core
  - pkg-config
  - msmpi
  - mpi4py
  - pip
